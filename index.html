<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <script src="https://unpkg.com" crossorigin></script>

  <script src="https://unpkg.com"></script>

      --color-bg-base: #FAF8F4;
    }
    body {
      background-color: var(--color-bg-base);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

<body>

  <div id="root"></div>

  <script type="text/babel">
    // --- IDENTITY CRADLE INITIALIZATION ---
    // Replace these values with your actual Supabase Project Key tokens
    const SUPABASE_URL = "https://hieirxacyqbbpjrygvld.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_Nb3FMS7u2MGoCmz1Qx_ZVg_WHDpdbI7";

    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- MESSAGING STATE CONFIGURATION ---
    const ChatContext = React.createContext(undefined);

    const ChatProvider = ({ children }) => {
      const [activeConversationId, setActiveConversationId] = React.useState(null);
      const [activeMessages, setActiveMessages] = React.useState([]);

      React.useEffect(() => {
        if (!activeConversationId) return;

        // Synchronize chronological message log
        supabase.from('messages')
          .select('*')
          .eq('conversation_id', activeConversationId)
          .order('created_at', { ascending: true })
          .then(({ data }) => { if (data) setActiveMessages(data); });

        // Spin up persistent secure socket connection
        const realTimeChannel = supabase.channel(`room:${activeConversationId}`)
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `conversation_id=eq.${activeConversationId}` }, 
          (payload) => { setActiveMessages((prev) => [...prev, payload.new]); })
          .subscribe();

        return () => { supabase.removeChannel(realTimeChannel); };
      }, [activeConversationId]);

      const sendMessage = async (content) => {
        if (!activeConversationId) return;
        const userRes = await supabase.auth.getUser();
        if (!userRes.data.user) return;

        await supabase.from('messages').insert([{
          conversation_id: activeConversationId,
          content: content,
          sender_id: userRes.data.user.id
        }]);
      };

      return (
        <ChatContext.Provider value={{ activeMessages, sendMessage, joinConversation: setActiveConversationId, activeConversationId }}>
          {children}
        </ChatContext.Provider>
      );
    };

    const useChat = () => {
      const context = React.useContext(ChatContext);
      if (!context) throw new Error("useChat bound outside framework boundary error.");
      return context;
    };

    // --- ACCESS GATEWAY WORKFLOWS ---
    const AuthGate = () => {
      const [isRegister, setIsRegister] = React.useState(false);
      const [email, setEmail] = React.useState('');
      const [password, setPassword] = React.useState('');
      const [username, setUsername] = React.useState('');
      const [errorMsg, setErrorMsg] = React.useState(null);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg(null);

        if (isRegister) {
          if (username.length < 3) { setErrorMsg("Pseudonym signature needs 3 characters minimum."); return; }
          const { data, error } = await supabase.auth.signUp({ email, password });
          if (error) { setErrorMsg(error.message); return; }
          if (data.user) {
            await supabase.from('profiles').insert([{ id: data.user.id, username, display_name: username }]);
            alert("Safe signature recorded. Please verify via email loop sequence.");
          }
        } else {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) setErrorMsg("Boundary rejected matching profile validation vectors.");
        }
      };

      return (
        <div className="h-screen w-screen flex items-center justify-center p-4 text-stone-900 bg-[#FAF8F4]">
          <form onSubmit={handleSubmit} className="flex flex-col gap-4 p-8 bg-white border border-stone-200 rounded-xl shadow-xl w-full max-w-md">
            <h2 className="text-2xl font-bold text-teal-800 text-center">{isRegister ? 'Generate Pseudonym' : 'Access Safe Sanctuary'}</h2>
            
            {isRegister && (
              <div>
                <label className="block text-xs font-semibold uppercase tracking-wider mb-1 text-stone-500">Pseudonym Signature</label>
                <input type="text" required value={username} onChange={(e) => setUsername(e.target.value)} className="w-full px-3 py-2 border rounded border-stone-300 focus:ring-2 focus:ring-teal-700 outline-none transition bg-transparent" placeholder="e.g. silent_soul" />
              </div>
            )}
            
            <div>
              <label className="block text-xs font-semibold uppercase tracking-wider mb-1 text-stone-500">Identity Vector (Email)</label>
              <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full px-3 py-2 border rounded border-stone-300 focus:ring-2 focus:ring-teal-700 outline-none transition bg-transparent" />
            </div>
            
            <div>
              <label className="block text-xs font-semibold uppercase tracking-wider mb-1 text-stone-500">Secret Token Marker (Password)</label>
              <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-3 py-2 border rounded border-stone-300 focus:ring-2 focus:ring-teal-700 outline-none transition bg-transparent" />
            </div>

            {errorMsg && <p role="alert" className="text-xs text-red-500 font-medium">{errorMsg}</p>}
            
            <button type="submit" className="w-full bg-teal-800 hover:bg-teal-900 text-white font-medium py-2 rounded transition shadow-sm">
              {isRegister ? 'Instantiate Node Profile' : 'Authenticate Identity'}
            </button>
            
            <button type="button" onClick={() => setIsRegister(!isRegister)} className="text-xs text-teal-700 hover:underline text-center mt-2">
              {isRegister ? 'Already verified state vectors? Login' : 'Need an isolated identity handle? Register'}
            </button>
          </form>
        </div>
      );
    };

    // --- SECURE WORKSPACE CORE PANEL ---
    const InnerSanctuaryChatView = () => {
      const { activeMessages, sendMessage, joinConversation, activeConversationId } = useChat();
      const [inputMsg, setInputMsg] = React.useState('');
      const [rooms, setRooms] = React.useState([]);

      React.useEffect(() => {
        supabase.from('conversation_participants')
          .select('conversation_id, conversations(created_at)')
          .then(({ data }) => { if (data) setRooms(data.map((item) => item.conversations)); });
      }, []);

      const handleSend = async (e) => {
        e.preventDefault();
        if (!inputMsg.trim()) return;
        await sendMessage(inputMsg);
        setInputMsg('');
      };

      const allocateNewMatrixNode = async () => {
        const userRes = await supabase.auth.getUser();
        if (!userRes.data.user) return;
        
        const { data: conv } = await supabase.from('conversations').insert([{}].map(() => ({}))).select().single();
        if (conv) {
          await supabase.from('conversation_participants').insert([{ conversation_id: conv.id, user_id: userRes.data.user.id }]);
          setRooms((prev) => [...prev, conv]);
          joinConversation(conv.id);
        }
      };

      return (
        <div className="flex h-screen w-screen bg-stone-50 text-stone-900">
          <aside className="w-80 border-r border-stone-200 flex flex-col p-4 bg-white shadow-sm">
            <div className="flex items-center justify-between mb-6">
              <h1 className="text-xl font-bold tracking-tight text-teal-800">Unheard Soul</h1>
              <button onClick={() => supabase.auth.signOut()} className="text-[10px] font-semibold border px-2 py-1 rounded bg-stone-50 hover:bg-stone-100 uppercase tracking-wide">Disconnect</button>
            </div>
            <button onClick={allocateNewMatrixNode} className="w-full bg-teal-800 hover:bg-teal-900 text-white font-medium py-2 rounded-lg mb-4 transition text-sm shadow-sm">Request Soul-Link Partition</button>
            <div className="flex-1 overflow-y-auto space-y-1">
              {rooms.map((r) => (
                <button key={r.id} onClick={() => joinConversation(r.id)} className={`w-full p-3 text-left rounded-lg transition text-xs border ${activeConversationId === r.id ? 'bg-teal-50 border-teal-600 text-teal-950 font-semibold' : 'border-transparent hover:bg-stone-50'}`}>
                  <p className="truncate font-medium">Secure Channel Node</p>
                  <p className="opacity-60 text-[10px] mt-0.5">{new Date(r.created_at).toLocaleString()}</p>
                </button>
              ))}
            </div>
          </aside>

          <main className="flex-1 flex flex-col bg-[#FAF8F4]">
            {activeConversationId ? (
              <>
                <div className="flex-1 overflow-y-auto p-6 space-y-4">
                  {activeMessages.map((m) => (
                    <div key={m.id} className="flex w-full justify-start">
